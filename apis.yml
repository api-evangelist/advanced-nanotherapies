aid: advanced-nanotherapies
name: Advanced NanoTherapies
description: >-
  Advanced NanoTherapies, Inc. (ANT) is a clinical-stage medical device company founded in 2018 and
  based in Santa Clara / Los Gatos, California, applying nanoparticle engineering to vascular drug
  delivery. Its lead program, SirPlux Duo, is a dual-drug drug-coated balloon (DCB) that delivers
  sirolimus and paclitaxel simultaneously from a proprietary nanoparticle coating to inhibit
  restenosis in coronary and peripheral arteries, and it has received FDA Breakthrough Device
  designations for small-vessel coronary artery disease, coronary in-stent restenosis and
  below-the-knee peripheral lesions. The company builds physical interventional devices rather than
  software; it operates no developer program and publishes no public API, SDK, webhook surface or
  machine-readable API contract.
